<nav class="top-navbar" id="topNavbar">
  <button class="nav-icon-btn d-lg-none me-2" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </button>

  <div class="navbar-breadcrumb" id="navBreadcrumb">
    <span class="breadcrumb-item">GoCheck</span>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-item active" id="pageLabel">Dashboard</span>
  </div>

  <div class="navbar-actions">
    <!-- Notificaciones -->
    <div class="nav-icon-btn" title="Notificaciones">
      <i class="fas fa-bell"></i>
      <span class="dot"></span>
    </div>

    <!-- Reloj -->
    <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);min-width:48px;text-align:right"
      id="navClock"></div>
  </div>
</nav>

<script>
  // Reloj en navbar
  (function () {
    function tick() {
      const el = document.getElementById('navClock');
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    }
    tick();
    setInterval(tick, 30000);

    // Breadcrumb dinámico
    const labels = {
      'dashboard.html': 'Dashboard',
      'empleados.html': 'Empleados',
      'turnos.html': 'Turnos',
      'asistencias.html': 'Asistencias',
      'solicitudes.html': 'Solicitudes',
      'reportes.html': 'Reportes',
      'usuarios.html': 'Usuarios',
      'bitacora.html': 'Bitácora',
      'checador.html': 'Terminal GoCheck',
    };
    const page = window.location.pathname.split('/').pop();
    const lbl = document.getElementById('pageLabel');
    if (lbl && labels[page]) lbl.textContent = labels[page];
  })();
</script>
